name: CI

on:
  push:
    # 3시간 주기 데이터 봇 커밋(산출물만 변경)은 CI를 건너뛴다.
    paths-ignore:
      - 'data/**'
      - 'products/**'
      - 'index.html'
      - 'resources.html'
      - '404.html'
      - 'sitemap.xml'
      - 'robots.txt'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 실제 소요는 30초 내외(의존성 설치 ~11초, 테스트 ~5초, 빌드 스모크 ~1초)다.
    # 네트워크 지연이나 테스트 증가를 감안해도 충분한 상한.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 락파일로 설치해 상류 릴리스가 CI를 깨뜨리지 않게 한다.
      # 갱신 절차는 docs/dependency-locks.md 참고.
      - name: Install dependencies
        run: pip install -r requirements-dev.lock.txt

      # node --test의 위치 인자 해석이 메이저 버전마다 달라(22에서 디렉터리 재귀 제거)
      # 러너 기본 Node에 맡기면 조용히 깨진다. 로컬과 같은 22로 고정한다.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint (ruff)
        run: ruff check .

      - name: JS syntax check
        run: |
          for f in js/*.js js/lib/*.js; do node --check "$f"; done

      - name: JS unit tests
        run: node --test tests/js/

      - name: Run tests
        run: pytest -q

      - name: Build site smoke test
        run: |
          python scripts/build_static_site.py --output /tmp/site-build
          test -f /tmp/site-build/index.html
          test -f /tmp/site-build/sitemap.xml
          count=$(ls /tmp/site-build/products/*.html | wc -l)
          echo "Built $count product pages"
          test "$count" -ge 300
