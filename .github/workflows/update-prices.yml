name: Update Nikon Prices

on:
  schedule:
    - cron: '0 */3 * * *'  # 3시간마다 (UTC 0,3,6,9,12,15,18,21)
  workflow_dispatch:       # 수동 트리거

concurrency:
  group: update-prices
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write  # 데이터 커밋 후 deploy-pages.yml 체인 트리거용

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    # 정상 실행은 7~9분(최근 120회 중앙값 7.7분, p90 9.3분)이지만, eBay가 429를
    # 반환하면 ebay.py의 지수 백오프(최대 160초 × 최대 6회)가 검색마다 반복되어
    # 실제로 73~97분까지 늘어난 사례가 있다. 그런 실행도 성공했으므로 관측 최대치
    # (97분)보다는 여유를 두고, GitHub Actions 기본값 6시간보다는 훨씬 짧게 잡는다.
    # 상한을 크론 주기(3시간)보다 낮게 유지해야 concurrency 그룹에 실행이 쌓이지 않는다.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.lock.txt

      # LLM 판정 캐시는 실행마다 거의 전 항목의 최근사용 시각이 갱신되므로,
      # 저장소에 커밋하면 수 MB 블롭이 3시간마다 통째로 바뀐다(data/daily를 걷어낸
      # 이유와 같은 문제). Actions 캐시에 두면 저장소를 키우지 않고 실행 간 유지된다.
      - name: Restore LLM decision cache
        uses: actions/cache@v4
        with:
          path: data/llm-cache.json
          key: llm-cache-${{ github.run_id }}
          restore-keys: llm-cache-

      - name: Fetch eBay prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # eBay Partner Network 캠페인 ID. 시크릿이 등록되지 않으면 빈 문자열이
          # 전달되어 ebay.py가 X-EBAY-C-ENDUSERCTX 헤더를 붙이지 않으므로,
          # 미설정 상태에서도 기존 동작이 그대로 유지된다.
          EBAY_EPN_CAMPAIGN_ID: ${{ secrets.EBAY_EPN_CAMPAIGN_ID }}
        run: python scripts/fetch_prices.py

      - name: Validate public site build
        run: python scripts/build_static_site.py --output dist

      - name: Commit and push data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # config/products.yaml도 함께 커밋해야 적응형 상한 되먹임이 살아남는다.
          # (data/만 add하면 갱신된 max_price가 매 실행마다 버려져 효과가 0이 된다)
          git add data/ config/products.yaml
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "📊 Update price data $(date -u +%Y-%m-%d)"
          # 충돌 시 -X ours로 수집 데이터를 조용히 버리는 대신, rebase 실패를
          # 그대로 실패로 표면화해 아래 이슈 생성 스텝이 발동하게 한다.
          push_ok=false
          for attempt in 1 2 3; do
            if git push; then
              push_ok=true
              break
            fi
            echo "Push rejected (attempt ${attempt}/3), rebasing onto latest remote..."
            git pull --rebase
            sleep $((attempt * 5))
          done
          if [ "$push_ok" != "true" ]; then
            git push
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN 푸시는 push 트리거를 발화시키지 않으므로 명시적으로
        # 배포 워크플로를 호출한다.
        run: gh workflow run deploy-pages.yml --ref master

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Price update failed $(date -u +%Y-%m-%d)" \
            --body "The daily price update workflow failed. Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --label "automated" \
            || echo "Could not create issue (label may not exist)"
