name: Deploy site to GitHub Pages

# 빌드 산출물을 저장소에 커밋하지 않고 Pages artifact로 직접 배포한다.
# (Settings → Pages → Source = "GitHub Actions" 전환 완료)
#
# 트리거:
# - master로의 코드 머지(push): 템플릿/JS/CSS 변경을 즉시 배포
#   (data/만 바뀐 푸시는 제외 — 데이터 갱신은 아래 경로로 배포된다)
# - update-prices.yml이 데이터 커밋 후 gh workflow run으로 체인 트리거
# - 수동 실행(workflow_dispatch)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'data/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build static site
        run: python scripts/build_static_site.py --output dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
